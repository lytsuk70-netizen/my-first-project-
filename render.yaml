# Render Blueprint: one free web service built from the Dockerfile.
# The database is Neon (external); DATABASE_URL is entered once in the Render dashboard.
services:
  - type: web
    name: groshi-ok
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      # Only personal accounts in the app: TALKO legal entities «Гроші Окей» and «ФОП Луцюк ЮП ПП»
      - key: TALKO_ENTITY_IDS
        value: hm3HL8FgqM1RHcr9hH8L,rdXfhqXyKQ9bmzOG1hC2

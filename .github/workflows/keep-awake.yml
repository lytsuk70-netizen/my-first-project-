# Keeps the free Render instance awake so «Гроші ОК» opens instantly (Render sleeps after 15 min idle).
name: keep-awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # static page only: wakes the server without waking the Neon database (keeps its free compute hours)
      - run: curl -fsS -m 90 -o /dev/null -w "%{http_code}\n" https://groshi-ok.onrender.com/
